name: Numéro hebdomadaire (génération automatique du pipeline)

# Décision du mainteneur : ANTHROPIC_API_KEY ne sera jamais configurée en
# secret de dépôt — les numéros sont générés à la main (session Claude Code,
# skill /mise-a-jour), pas par ce workflow. Le déclenchement planifié est donc
# désactivé : il échouerait chaque semaine sans jamais réussir (sys.exit dès
# la vérification de la clé dans generate_issue.py), pour rien de plus qu'une
# croix rouge hebdomadaire dans l'onglet Actions. Le code et le workflow
# restent en place, utilisables en manuel (bouton "Run workflow") si ce choix
# change un jour.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generer-publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml jinja2 markdown anthropic

      - name: Générer le numéro (sélection + synthèses par IA)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Facultatif : repli Unpaywall pour le texte intégral en accès libre.
          # Pas un secret (Unpaywall l'exige juste comme contact) — variable de
          # dépôt (Settings > Secrets and variables > Actions > Variables).
          UNPAYWALL_EMAIL: ${{ vars.UNPAYWALL_EMAIL }}
        run: python3 pipeline/generate_issue.py --days 7

      - name: Committer le brouillon sur main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain content/issues)" ]; then
            git add content/issues
            git commit -m "Numéro hebdomadaire automatique ($(date -u +%Y-%m-%d)) — généré par IA, sans relecture"
            git push
          else
            echo "Aucun nouveau numéro à committer."
          fi

      - name: Rafraîchir la veille PubMed brute
        run: python3 pipeline/fetch_pubmed.py || echo "PubMed indisponible — build sans rafraîchir la veille"

      - name: Construire le site
        run: python3 site/build.py

      - name: Déployer sur gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Déploiement automatique ($(date -u +%Y-%m-%d))"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
